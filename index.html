<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý người dùng - React CRUD</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f9;
      color: #222;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin: 0 0 20px; color: #1f3a5f; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .search-input {
      flex: 1; min-width: 220px; padding: 10px 12px;
      border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
    }
    button {
      padding: 8px 14px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 14px; color: #fff;
    }
    .btn-add { background: #2e7d32; padding: 10px 18px; }
    .btn-edit { background: #1976d2; margin-right: 6px; }
    .btn-delete { background: #d32f2f; }
    .btn-cancel { background: #757575; }
    .btn-save { background: #2e7d32; }
    button:hover { opacity: 0.85; }

    .table-wrap { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #1f3a5f; color: #fff; }
    tr:hover td { background: #f7f9fc; }
    td.actions { white-space: nowrap; }
    .empty { text-align: center; color: #888; padding: 20px; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex; justify-content: center; align-items: center;
      z-index: 999; padding: 16px;
    }
    /* Modal Content */
    .modal-content {
      background: #fff; padding: 20px; border-radius: 8px;
      width: 380px; max-width: 100%; max-height: 90vh; overflow-y: auto;
    }
    .modal-content h4 { margin: 0 0 14px; font-size: 18px; color: #1f3a5f; }
    .form-row { display: flex; flex-direction: column; margin-bottom: 10px; }
    .form-row label { font-size: 13px; margin-bottom: 4px; color: #555; }
    .form-row input { padding: 8px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const FIELDS = [
      { id: "name", label: "Name" },
      { id: "username", label: "Username" },
      { id: "email", label: "Email" },
      { id: "street", label: "Street", nested: true },
      { id: "suite", label: "Suite", nested: true },
      { id: "city", label: "City", nested: true },
      { id: "phone", label: "Phone" },
      { id: "website", label: "Website" },
    ];

    const emptyUser = () => ({
      name: "", username: "", email: "",
      address: { street: "", suite: "", city: "" },
      phone: "", website: "",
    });

    // Form dùng chung cho Thêm và Sửa (controlled component)
    function UserForm({ title, data, onChange, onSubmit, onCancel, submitText }) {
      return (
        <div className="modal-overlay" onClick={onCancel}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <h4>{title}</h4>
            {FIELDS.map((f) => (
              <div className="form-row" key={f.id}>
                <label htmlFor={f.id}>{f.label}:</label>
                <input
                  id={f.id}
                  type="text"
                  value={f.nested ? data.address[f.id] : data[f.id]}
                  onChange={(e) => onChange(f.id, e.target.value)}
                />
              </div>
            ))}
            <div className="modal-actions">
              <button className="btn-save" onClick={onSubmit}>{submitText}</button>
              <button className="btn-cancel" onClick={onCancel}>Hủy</button>
            </div>
          </div>
        </div>
      );
    }

    function updateField(obj, id, value) {
      if (["street", "suite", "city"].includes(id)) {
        return { ...obj, address: { ...obj.address, [id]: value } };
      }
      return { ...obj, [id]: value };
    }

    function SearchForm({ onChangeValue }) {
      return (
        <input
          className="search-input"
          type="text"
          placeholder="Tìm theo name, username"
          onChange={(e) => onChangeValue(e.target.value)}
        />
      );
    }

    function AddUser({ onAdd }) {
      const [adding, setAdding] = React.useState(false);
      const [user, setUser] = React.useState(emptyUser());

      const handleChange = (id, value) => setUser(updateField(user, id, value));

      const handleAdd = () => {
        if (user.name.trim() === "" || user.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        onAdd(user);
        setUser(emptyUser());
        setAdding(false);
      };

      return (
        <div>
          <button className="btn-add" onClick={() => setAdding(true)}>+ Thêm</button>
          {adding && (
            <UserForm
              title="Thêm người dùng"
              data={user}
              onChange={handleChange}
              onSubmit={handleAdd}
              onCancel={() => setAdding(false)}
              submitText="Thêm"
            />
          )}
        </div>
      );
    }

    function ResultTable({ keyword, user, onAdded }) {
      const [users, setUsers] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [editing, setEditing] = React.useState(null);

      // Tải dữ liệu 1 lần khi component mount
      React.useEffect(() => {
        fetch("https://jsonplaceholder.typicode.com/users")
          .then((res) => res.json())
          .then((data) => { setUsers(data); setLoading(false); })
          .catch(() => setLoading(false));
      }, []);

      // Khi prop user thay đổi -> thêm vào danh sách
      React.useEffect(() => {
        if (user) {
          setUsers((prev) => {
            const maxId = prev.reduce((m, u) => Math.max(m, u.id), 0);
            return [...prev, { ...user, id: maxId + 1 }];
          });
          onAdded();
        }
      }, [user]);

      function editUser(u) {
        setEditing({ ...u, address: { ...u.address } });
      }

      function handleEditChange(id, value) {
        setEditing((prev) => updateField(prev, id, value));
      }

      function saveUser() {
        if (editing.name.trim() === "" || editing.username.trim() === "") {
          alert("Vui lòng nhập Name và Username!");
          return;
        }
        setUsers((prev) => prev.map((u) => (u.id === editing.id ? editing : u)));
        setEditing(null);
      }

      function removeUser(id) {
        setUsers((prev) => prev.filter((u) => u.id !== id));
      }

      const kw = keyword.toLowerCase();
      const filteredUsers = users.filter(
        (u) =>
          u.name.toLowerCase().includes(kw) ||
          u.username.toLowerCase().includes(kw)
      );

      if (loading) return <p>Đang tải dữ liệu...</p>;

      return (
        <div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th><th>Name</th><th>Username</th><th>Email</th>
                  <th>Address</th><th>Phone</th><th>Action</th>
                </tr>
              </thead>
              <tbody>
                {filteredUsers.map((u) => (
                  <tr key={u.id}>
                    <td>{u.id}</td>
                    <td>{u.name}</td>
                    <td>{u.username}</td>
                    <td>{u.email}</td>
                    <td>{[u.address.street, u.address.suite, u.address.city].filter(Boolean).join(", ")}</td>
                    <td>{u.phone}</td>
                    <td className="actions">
                      <button className="btn-edit" onClick={() => editUser(u)}>Sửa</button>
                      <button className="btn-delete" onClick={() => removeUser(u.id)}>Xóa</button>
                    </td>
                  </tr>
                ))}
                {filteredUsers.length === 0 && (
                  <tr><td colSpan="7" className="empty">Không có người dùng phù hợp</td></tr>
                )}
              </tbody>
            </table>
          </div>

          {editing && (
            <UserForm
              title="Sửa người dùng"
              data={editing}
              onChange={handleEditChange}
              onSubmit={saveUser}
              onCancel={() => setEditing(null)}
              submitText="Lưu"
            />
          )}
        </div>
      );
    }

    function App() {
      const [kw, setKeyword] = React.useState("");
      const [newUser, setNewUser] = React.useState(null);
      return (
        <div className="container">
          <h1>Quản lý người dùng</h1>
          <div className="toolbar">
            <SearchForm onChangeValue={setKeyword} />
            <AddUser onAdd={setNewUser} />
          </div>
          <ResultTable keyword={kw} user={newUser} onAdded={() => setNewUser(null)} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
